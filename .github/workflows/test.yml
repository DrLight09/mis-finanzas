name: Tests

# Corre en cada push a cualquier rama y en cada pull request — no es un
# cronjob, es un gatillo por evento. No toca el deploy de GitHub Pages
# (eso lo sigue manejando la configuración de Pages por separado).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # LTS. jsdom 27 (prueba de humo) pide Node 20+.

      # Las pruebas unitarias no necesitan nada, pero la prueba de humo
      # (scripts/smoke-browser.js) usa jsdom, que está en devDependencies.
      # "npm ci" instala EXACTAMENTE lo que dice package-lock.json (por eso
      # package.json y package-lock.json tienen que estar subidos al repo).
      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests
        run: npm test

      # Carga index.html y todos los js/ en jsdom, toca cada botón y falla si
      # alguna acción data-action no tiene handler o está registrada dos veces.
      - name: Prueba de humo (página real en jsdom)
        run: npm run smoke
