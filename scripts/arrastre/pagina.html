<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../css/styles.css">
<style>body{padding:16px;background:#181818;margin:0}</style></head><body>
<div style="height:120px"></div>
<div id="lista"><div class="cuentas-selector-grid cuentas-selector-ordenando" id="g"></div></div>
<div style="height:900px"></div>
<script src="../../js/core/reordenable.js"></script>
<script>
const datos=[['efectivo','Efectivo','240,184,64','#f0b840'],['cs','Banco Caja Social','226,34,46','#E2222E'],['nequi','Nequi','96,176,240','#60b0f0'],['nu','Nu','160,100,240','#a064f0'],['x','Otra','96,200,140','#60c88c']];
function pinta(){document.getElementById('g').innerHTML=datos.map(d=>`<div class="cuenta-card cuenta-card-ord" data-cuenta-id="${d[0]}" style="--cuenta:${d[3]};--cuenta-rgb:${d[2]}"><button class="cuenta-ord-grip"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg></button><div class="cuenta-card-head"><span class="cuenta-card-nombre">${d[1]}</span></div><div class="cuenta-card-etiqueta">Saldo</div><div class="cuenta-card-saldo">$ 10.000</div></div>`).join('');}
pinta();window.llamadas=[];
Reordenable.activar(document.getElementById('lista'),{item:'[data-cuenta-id]',id:n=>n.dataset.cuentaId,agarre:'.cuenta-ord-grip',onOrden:ids=>{window.llamadas.push(ids);ids.forEach((id,i)=>{});datos.sort((a,b)=>ids.indexOf(a[0])-ids.indexOf(b[0]));pinta();},onTeclado:(id,dir)=>{window.llamadas.push(['tecla',id,dir]);}});
</script></body></html>
